# Local development: PostgreSQL, the backend and the frontend.
# The source folders are mounted into the containers, so saved changes
# reload automatically. Start everything with: docker compose up --build

services:
  database:
    image: postgres:17
    container_name: training-tracker-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: training_user
      POSTGRES_PASSWORD: training_password
      POSTGRES_DB: training_tracker

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "training_user", "-d", "training_tracker"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: training-tracker-backend

    environment:
      # inside Docker the database is reached by its service name, not localhost;
      # this takes precedence over the localhost URL in backend/.env
      DATABASE_URL: postgresql+psycopg://training_user:training_password@database:5432/training_tracker

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: training-tracker-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      # keep the container's own node_modules instead of the host's
      - /app/node_modules

    depends_on:
      - backend

volumes:
  postgres_data:
